name: Publish BCS Store release
on:
  workflow_dispatch:
    inputs:
      publish_catalog:
        description: "Also create/update the OTA 'catalog' release (cars read this)"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Draft versioned release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view v2.2.3 >/dev/null 2>&1 && gh release delete v2.2.3 --yes || true
          gh release create v2.2.3 release-assets/v2.2.3/* --draft --prerelease \
            --title "BCS Store 2.2.3" --notes-file release-assets/v2.2.3/RELEASE_NOTES.md
      - name: Publish OTA catalog release
        if: ${{ inputs.publish_catalog }}
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if gh release view catalog >/dev/null 2>&1; then
            gh release upload catalog release-assets/catalog/* --clobber
          else
            gh release create catalog release-assets/catalog/* --title "Catalog" --notes "OTA catalog"
          fi
