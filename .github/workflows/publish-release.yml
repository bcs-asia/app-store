name: Publish BCS Store release
# Runs when a version's release-assets are merged to main (or by hand):
# publishes the versioned release (as the latest, not a pre-release) and
# refreshes the OTA 'catalog' release the cars read.
on:
  push:
    branches: [main]
    paths: ['release-assets/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versioned release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          V=$(node -p "require('./apps/bcs_store/mgu-app.json').version")
          echo "version $V"
          gh release view "v$V" >/dev/null 2>&1 && gh release delete "v$V" --yes || true
          gh release create "v$V" release-assets/v$V/* --latest \
            --title "BCS Store $V" --notes-file release-assets/v$V/RELEASE_NOTES.md
      - name: OTA catalog release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if gh release view catalog >/dev/null 2>&1; then
            for a in $(gh release view catalog --json assets --jq '.assets[].name'); do
              gh release delete-asset catalog "$a" --yes
            done
            gh release upload catalog release-assets/catalog/*
          else
            gh release create catalog release-assets/catalog/* --title "Catalog" --notes "OTA catalog" --latest=false
          fi
